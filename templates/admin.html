<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Terminal</title>
    <!--Using 7.css even here hehe-->
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <style>
        body {
            background: #008080;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="window" style="width: 800px;">
        <div class="title-bar">
            <div class="title-bar-text">DMN_Uploader.exe</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>

        <div class="window-body" style="padding: 20px;">
            <form action="/secret-admin" method="POST">

                <div class="field-row-stacked">
                    <label for="title" style="font-size: 16px; font-weight: bold;">Log Title</label>
                    <input id="title" name="title" type="text" style="width: 100%; font-size: 16px; padding: 5px;" required>
                </div>

                <div class="field-row-stacked" style="margin-top: 20px;">
                    <label for="content" style="font-size: 16px; font-weight: bold;">What's on your mind?</label>
                    <textarea name="content" id="content" rows="10" style="width: 100%; font-size: 16px; padding: 5px; resize: vertical;" required></textarea>
                </div>

                <button type="submit" style="margin-top: 20px; padding: 8px 20px; font-size: 16px; cursor: pointer;">
                    Publish to Database
                </button>
            </form>
        </div>
    </div>
    
</body>
</html>
