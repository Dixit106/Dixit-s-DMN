<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Terminal</title>
    <!--Using 7.css even here hehe-->
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <style>
        body {
            background: #008080;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
            gap: 20px;
        }
    </style>
</head>
<body>

    <div class="window" style="width: 800px;">
        <div class="title-bar">
            <div class="title-bar-text">DMN_Uploader.exe</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>

        <div class="window-body" style="padding: 20px;">
            <form action="/secret-admin" method="POST">

                <div class="field-row-stacked">
                    <label for="title" style="font-size: 16px; font-weight: bold;">Log Title</label>
                    <input id="title" name="title" type="text" style="width: 100%; font-size: 16px; padding: 5px;" required>
                </div>

                <div class="field-row-stacked" style="margin-top: 20px;">
                    <label for="content" style="font-size: 16px; font-weight: bold;">What's on your mind?</label>
                    <textarea name="content" id="content" rows="10" style="width: 100%; font-size: 16px; padding: 5px; resize: vertical;" required></textarea>
                </div>

                <button type="submit" style="margin-top: 20px; padding: 8px 20px; font-size: 16px; cursor: pointer;">
                    Publish to Database
                </button>
            </form>
        </div>
    </div>
    
    <div class="window" style="width: 800px">
        <div class="title-bar">
            <div class="title-bar-text">Database_Manager.exe</div>
        </div>
        <div class="window-body" style="padding: 20px; max-height: 500px; overflow-y: scroll;">
            {% for entry in entries %}
                <fieldset style="margin-bottom: 25px; padding: 15px;">
                    <legend style="font-weight: bold;">{{ entry.title }} ({{ entry.date_posted.strftime('%b %d, %Y') }})</legend>

                    <form action="/edit/{{ entry.id }}" method="POST">
                        <div class="field-row-stacked">
                            <label>Title</label>
                            <input name="title" type="text" value="{{ entry.title }}" style="width: 100%;">
                        </div>

                        <div class="field-row-stacked" style="margin-top: 10px;">
                            <label>Image URL</label>
                            <input name="image_url" type="text" value="{% if entry.image_url %}{{ entry.image_url}}{% endif %}" style="width: 100%;">
                        </div>

                        <div class="field-row-stacked" style="margin-top: 10px;">
                            <label>Content</label>
                            <textarea name="content" rows="4" style="width: 100%;">{{ entry.content }}</textarea>
                        </div>
                        
                        <div style="margin-top: 15px; display: flex; gap: 10px;">
                            <button type="submit">Save Edits</button>
                        </div>
                    </form>

                    <form action="/delete/{{ entry.id }}" method="POST" style="margin-top: -23px; text-align: right;">
                        <button type="submit" style="color: darkred">Delete Log</button>
                    </form>
                </fieldset>

            {% else %}
                <p>No logs found in the database.</p>
            {% endfor %}
        </div>
    </div>

</body>
</html>
