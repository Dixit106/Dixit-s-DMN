<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
 <div class="portrait-container">
    <!--Default Image-->
    <img src="{{ url_for('static', filename='ascii-art_dixit.png') }}" alt="ASCII Dixit" id="ascii-image" class="visible-image">
    <img src="{{ url_for('static', filename='digicam.jpg') }}" alt="Dixit" id="base-image" class="visible-image" style="display: none;">
    <canvas id="trail-canvas"></canvas>
 </div>

 <script>
    const canvas = document.getElementById('trail-canvas');
    const ctx = canvas.getContext('2d');
    const visibleImg = document.getElementById('ascii-image'); // Fixed typo here
    const hiddenImg = document.getElementById('base-image');

    let trail = [];

    function resizeCanvas() {
        canvas.width = visibleImg.offsetWidth;
        canvas.height = visibleImg.offsetHeight;
    }

    visibleImg.addEventListener('load', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    if (visibleImg.complete) {
        resizeCanvas();
    }

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        trail.push({ x: x, y: y, age: 0 });
    });

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        trail.forEach((point, index) => {
            point.age += 1;

            if(point.age > 45) {
                trail.splice(index, 1);
                return;
            }

            const radius = 60;
            const opacity = 1 - (point.age / 45);

            ctx.beginPath();
            ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`;
            ctx.fill();
        });

        ctx.globalCompositeOperation = 'source-in';
        ctx.drawImage(hiddenImg, 0, 0, canvas.width, canvas.height); // Fixed typo here

        ctx.globalCompositeOperation = 'source-over';

        requestAnimationFrame(animate);
    }

    animate();
</script>
    
</body>
</html>
