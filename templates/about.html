<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=3) }}">
</head>

<body id="about-page">

    <div class="portrait-wrapper" id="hover-container">
        <img src="{{ url_for('static', filename='ascii-art_dixit.png') }}" class="bottom-layer">

        <img src="{{ url_for('static', filename='digicam.jpg') }}" class="top-layer" id="reveal-image">
    </div>
    
<script>
    const container = document.getElementById('hover-container');
    const revealImg = document.getElementById('reveal-image');

    let targetX = -100;
    let targetY = -100;
    let currentX1 = -100;
    let currentY1 = -100;
    let currentX2 = -100;
    let currentY2 = -100;

    container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        targetX = ((e.clientX - rect.left) / rect.width) * 100;
        targetY = ((e.clientY - rect.top) / rect.height) * 100;
    });

    container.addEventListener('mouseleave', () => {
        targetX = -100;
        targetY = -100;
    });

    function animate() {
        // Formula: current = current + (target - current) * speed
        currentX1 += (targetX - currentX1) * 0.04; 
        currentY1 += (targetY - currentY1) * 0.04;
        currentX2 += (targetX - currentX2) * 0.12;
        currentY2 += (targetY - currentY2) * 0.12;

        revealImg.style.setProperty('--x1', `${currentX1}%`);
        revealImg.style.setProperty('--y1', `${currentY1}%`);
        revealImg.style.setProperty('--x2', `${currentX2}%`);
        revealImg.style.setProperty('--y2', `${currentY2}%`);

        requestAnimationFrame(animate);
    }

    animate();
</script>
    
</body>
</html>
