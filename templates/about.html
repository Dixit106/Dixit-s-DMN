<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=3) }}">
</head>

<body id="about-page">

    <div class="portrait-wrapper" id="hover-container">
        <img src="{{ url_for('static', filename='ascii-art_dixit.png') }}" class="bottom-layer">

        <img src="{{ url_for('static', filename='digicam.jpg') }}" class="top-layer" id="reveal-image">
    </div>
    
 <script>
    const container = document.getElementById('hover-container');
    const revealImg = document.getElementById('reveal-image');

    container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();

        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;

        revealImg.style.setProperty('--x', `${x}%`);
        revealImg.style.setProperty('--y', `${y}%`);
    });

    container.addEventListener('mouseleave', () => {
        revealImg.style.setProperty('--x', `-100%`);
        revealImg.style.setProperty('--y', `-100%`);
    });
</script>
    
</body>
</html>
