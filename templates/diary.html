<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>diary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="diary-body">
    <img src="/static/frutiger_aero_avatar_png__by_caitlinpinkartist_dm9c4b4-pre.png" alt="Avatar" id="floating-avatar">
            <div class="aero-glass-panel">
                <h3 style="color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5)">DMN Logs & Entries</h3>
                <p style="color: white;">Select a log file to read...</p>

              <ul class="entry-list">
                {% for entry in entries %}
                <li>
                    <details>
                        <summary>{{ entry.title }} ({{ entry.date_posted.strftime('%b %d, %Y') }})</summary>
                        <div class="entry-content">
                            <p>{{ entry.content }}</p>
                        </div>
                    </details>
                </li>
            {% else %}
                <li>No entries found in the database.</li>
            {% endfor %}
              </ul>

              <br>
              <a href="/" style="text-decoration: none;">
                <button class="aero-btn">Return to Home</button>
              </a>

        </div>

<div class="aero-water-container">

    <div class="wave wave-back"></div>
    <div class="underwater-grass"></div>
    <div class="wave wave-mid"></div>
    <div class="wave wave-front"></div>

    <div class="aero-bubbles">
        <div class="bubble" style="--size: 25px; --left: 15%; --delay: 0s; --speed: 4s;"></div>
        <div class="bubble" style="--size: 45px; --left: 45%; --delay: 2s; --speed: 6s;"></div>
        <div class="bubble" style="--size: 15px; --left: 75%; --delay: 1s; --speed: 3s;"></div>
        <div class="bubble" style="--size: 30px; --left: 85%; --delay: 3s; --speed: 5s;"></div>
    </div>
</div>
   

<script>
    const avatar = document.getElementById('floating-avatar');
    const mainWindow = document.querySelector('.aero-glass-panel');
    const water = document.querySelector('.aero-water-container');

    // Starting position will be top left corner
    let x = 20;
    let y = 20;

    // Speeeed
    let vx = 0.3;
    let vy = 0.3;

    function animateAvatar() {
        // Get current sizes and positions of everything
        const avRect = avatar.getBoundingClientRect();
        const winRect = mainWindow.getBoundingClientRect();
        const waterRect = water.getBoundingClientRect();

        // Bounce off screen edges
        if (avRect.left <= 0 && vx < 0) vx *= -1; // left wall
        if (avRect.right >= window.innerWidth && vx > 0) vx *= -1; // right wall
        if (avRect.top <= 0 && vy < 0) vy *= -1; // ceiling

        // Bounce off the water
        if (avRect.bottom >= waterRect.top && vy > 0) vy *= -1;

        // Bounce off the diary window
        if (avRect.right > winRect.left &&
            avRect.left < winRect.right &&
            avRect.bottom > winRect.top &&
            avRect.top < winRect.bottom) {

            // Figuring out which side it hit by seeing which overlap is smallest
            const overlapLeft = avRect.right - winRect.left;
            const overlapRight = winRect.right - avRect.left;
            const overlapTop = avRect.bottom - winRect.top;
            const overlapBottom = winRect.bottom - avRect.top;

            const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

            // Reverse the direction on the side it hit
            if (minOverlap === overlapLeft && vx > 0) vx *= -1;
            else if (minOverlap === overlapRight && vx < 0) vx *= -1;
            else if (minOverlap === overlapTop && vy > 0) vy *= -1;
            else if (minOverlap === overlapBottom && vy < 0) vy *= -1;
        }

        // Apply the new postion
        x += vx;
        y += vy;
        avatar.style.transform = `translate(${x}px, ${y}px)`;

        // We need that 60fps
        requestAnimationFrame(animateAvatar);
    }
    
    requestAnimationFrame(animateAvatar);
</script>

</body>
</html>
