<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>diary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!--7.css framework for the win7 vibe let's see how it looks-->
    <link rel="stylesheet" href="https://unpkg.com/7.css">
</head>
<body class="diary-body">
    <div class="diary-container">
        <div class="window">
            <div class="title-bar">
                <div class="title-bar-text">DMN Diary.exe</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>

            <div class="window-body">
                <h3>DMN Logs & Entries</h3>
                <p>Select a log file to read...</p>

                <ul class="tree-view">
                    <li>
                        <details open>
                            <summary>October 2026</summary>
                            <ul>
                                <li><a href="#">Oct 10: Building this Frutiger Aero site</a></li>
                                <li><a href="#">Oct 05: What exactly is the DMN</a></li>
                            </ul>
                        </details>
                    </li>

                    <li>
                        <details>
                            <summary>September 2026</summary>
                            <ul>
                                <li><a href="#">Sep 28: Thoughts on One Piece</a></li>
                                <li><a href="#">Sep 15: My favorite media right now</a></li>
                            </ul>
                        </details>
                    </li>

                </ul>

                <br>
                <a href="/" style="text-decoration: none;">
                    <button class="aero-btn">Return to Home</button>
                </a>
            </div>
        </div>
    </div>

<div class="aero-water-container">
    <div class="wave waave-back"></div>
    <div class="wave wave-mid"></div>
    <div class="wave wave-front"></div>

    <div class="aero-bubbles">
        <div class="bubble" style="--size: 25px; --left: 15%; --delay: 0s; --speed: 4s;"></div>
        <div class="bubble" style="--size: 45px; --left: 45%; --delay: 2s; --speed: 6s;"></div>
        <div class="bubble" style="--size: 15px; --left: 75%; --delay: 1s; --speed: 3s;"></div>
        <div class="bubble" style="--size: 30px; --left: 85%; --delay: 3s; --speed: 5s;"></div>
    </div>
</div>
    
</body>
</html>
