<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>diary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="diary-body">
    <div class="bubble-border border-left"></div>
    <div class="bubble-border border-right"></div>

    <img src="/static/frutiger_aero_avatar_png__by_caitlinpinkartist_dm9c4b4-pre.png" alt="Avatar" id="floating-avatar">
    <img src="/static/bottle.gif" alt="Sticker" id="floating-bottle-sticker">
    <img src="/static/fishbowl.gif" alt="Sticker 2" id="floating-fish">
    <img src="/static/bar-cat.gif" alt="Running Cat" id="border-cat">
    <div class="main-layout">
            <div class="aero-glass-panel">
                <h3>DMN Logs & Entries</h3>
                <p>Select a log file to read...</p>

              <ul class="entry-list">
                {% for entry in entries %}
                <li>
                    <details>
                        <summary>{{ entry.title }} ({{ entry.date_posted.strftime('%b %d, %Y') }})</summary>
                        <div class="entry-content">
                            <p>{{ entry.content }}</p>
                        </div>
                    </details>
                </li>
            {% else %}
                <li>No entries found in the database.</li>
            {% endfor %}
              </ul>

              <br>
              <a href="/" style="text-decoration: none;">
                <button class="aero-btn">Return to Home</button>
              </a>

        </div>

        <div class="right-sidebar">
            <div class="aero-widget music-widget">
                <div class="music-header">🎵 Media Player</div>

                <div class="cd-container">
                    <div class="aero-cd" id="spinning-cd"></div>
                </div>

                <div class="song-title">Track_01.mp3</div>

                <div class="music-controls">
                    <button class="aero-btn-small" id="play-pause-btn">▶</button>
                </div>

                <audio id="bg-audio">
                    <source src="/static/Nintendo Wii U - Mii Maker Editing Mii (TV + Gamepad).mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="aero-widget friend-widget">
                <h4 class="widget-header">Virtual Friend</h4>
                <div class="friend-habitat">
                    <img src="/static/default_luffy.png" alt="Virtual Friend" class="virtual friend" id="interactive-friend">
                </div>
            </div>
        </div>

    </div>

<div class="aero-water-container">

    <div class="wave wave-back"></div>
    <div class="underwater-grass"></div>
    <div class="wave wave-mid"></div>
    <div class="wave wave-front"></div>

    <div class="aero-bubbles">
        <div class="bubble" style="--size: 25px; --left: 15%; --delay: 0s; --speed: 4s;"></div>
        <div class="bubble" style="--size: 45px; --left: 45%; --delay: 2s; --speed: 6s;"></div>
        <div class="bubble" style="--size: 15px; --left: 75%; --delay: 1s; --speed: 3s;"></div>
        <div class="bubble" style="--size: 30px; --left: 85%; --delay: 3s; --speed: 5s;"></div>
    </div>
</div>



<script>
    const mainWindow = document.querySelector('.main-layout');
    const water = document.querySelector('.aero-water-container');

    //reusable 'Blueprint' for anything we want to float!
    class FloatingItem{
        constructor(elementId, startX, startY, speedX, speedY) {
            this.element = document.getElementById(elementId);
            this.x = startX;
            this.y = startY;
            this.vx = speedX;
            this.vy = speedY;
        }

        move() {
            if (!this.element) return;

            const rect = this.element.getBoundingClientRect();
            const winRect = mainWindow.getBoundingClientRect();
            const waterRect= water.getBoundingClientRect();

             // Bounce off screen edges
        if (rect.left <= 0 && this.vx < 0) this.vx *= -1; // left wall
        if (rect.right >= window.innerWidth && this.vx > 0) this.vx *= -1; // right wall
        if (rect.top <= 0 && this.vy < 0) this.vy *= -1; // ceiling

         // Bounce off the water
        if (rect.bottom >= waterRect.top && this.vy > 0) this.vy *= -1;

         // Bounce off the diary window
        if (rect.right > winRect.left &&
            rect.left < winRect.right &&
            rect.bottom > winRect.top &&
            rect.top < winRect.bottom) {

            // Figuring out which side it hit by seeing which overlap is smallest
            const overlapLeft = rect.right - winRect.left;
            const overlapRight = winRect.right - rect.left;
            const overlapTop = rect.bottom - winRect.top;
            const overlapBottom = winRect.bottom - rect.top;

            const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

            // Reverse the direction on the side it hit
            if (minOverlap === overlapLeft && this.vx > 0) this.vx *= -1;
            else if (minOverlap === overlapRight && this.vx < 0) this.vx *= -1;
            else if (minOverlap === overlapTop && this.vy > 0) this.vy *= -1;
            else if (minOverlap === overlapBottom && this.vy < 0) this.vy *= -1;
        }

        // Apply the new postion
        this.x += this.vx;
        this.y += this.vy;
        this.element.style.transform = `translate(${this.x}px, ${this.y}px)`;            
    }
}

//('element id', startx, starty, speedx, speedy)

//avatar
const avatar = new FloatingItem('floating-avatar', 20,20,0.1,0.1);

//bottle gif
const sticker1 = new FloatingItem('floating-bottle-sticker', 20,200,0.1, 0.1);

//fish gif
const sticker2 = new FloatingItem('floating-fish', 50, 300, 0.1, 0.1);

function animateAll() {
    avatar.move();
    sticker1.move();
    sticker2.move();

    requestAnimationFrame(animateAll);
}

// Start the engine!
requestAnimationFrame(animateAll);

//music player Logic
const audioEngine = document.getElementById('bg-audio');
const playPauseBtn = document.getElementById('play-pause-btn');
const spinningCd = document.getElementById('spinning-cd');

playPauseBtn.addEventListener('click', function(){
    if (audioEngine.paused) {
        audioEngine.play();
        playPauseBtn.innerHTML = '⏸'
        spinningCd.classList.add('spin');
    } else {
        audioEngine.pause();
        playPauseBtn.innerHTML = '▶';
        spinningCd.classList.remove('spin');
    }
});

const myAvatar = document.getElementById('floating-avatar');

myAvatar.addEventListener('click', function() {
    myAvatar.classList.add('sticker-clicked');
    setTimeout(() => {
        myAvatar.classList.remove('sticker-clicked');
        window.open('https://github.com/Dixit106', '_blank');
    }, 300);
});

const myFish = document.getElementById('floating-fish');
myFish.addEventListener('click', function() {
    myFish.classList.add('sticker-clicked');
    setTimeout(() => {
        myFish.classList.remove('sticker-clicked');
        window.open('https://youtu.be/haJfJAwpViI', '_blank');
    }, 300);
});


//virtual friend logic
const myFriend = document.getElementById('interactive-friend');

const luffyReactions = [
    '/static/fat_luffy.png',
    '/static/handsup_luffy.png',
    '/static/jumping_luffy.png',
    '/static/luffy_looking_right.png',
    '/static/luffy_right_thumbsup.png'
];

myFriend.addEventListener('click', function() {
    const randomIndex = Math.floor(Math.random() * luffyReactions.length);
    myFriend.src = luffyReactions[randomIndex];
    myFriend.style.transform = ' translateY(-15px)';
    setTimeout(() => {
        myFriend.src = '/static/default_luffy.png';
        myFriend.style.transform = '';
    }, 500);
});
</script>

</body>
</html>
